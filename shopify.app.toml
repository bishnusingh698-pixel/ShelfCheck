# This file stores the configurations for your Shopify app.
client_id = ""

[access_scopes]
# Required scopes. write_products grants read_products ("a write scope
# includes read") and is OPTIONAL: the app requests it at runtime only for the
# auto-tag feature (spec: never declare write_products as a required scope).
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory"
optional_scopes = ["write_products"]

[webhooks]
# Pinned Admin API version (docs/api-notes.md §1: 2026-07 = latest stable).
api_version = "2026-07"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.app-subscriptions.update.tsx
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app-subscriptions/update"

  # Handled by: /app/routes/webhooks.products.tsx (Phase 7)
  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = ["products/create", "products/update", "products/delete"]

  # Handled by: /app/routes/webhooks.inventory-levels.update.tsx (Phase 7)
  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory-levels/update"
  topics = ["inventory_levels/update"]

  # Handled by: /app/routes/webhooks.bulk-operations.finish.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk-operations/finish"
  topics = ["bulk_operations/finish"]

  # Mandatory compliance topics for public apps.
  # Handled by: /app/routes/webhooks.compliance.tsx (one route, scrubbed payloads).
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
